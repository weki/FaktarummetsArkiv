spring.application.name=FakturummetsArkivRAG
# Valfri lokal overrides-fil (gitignorerad) för t.ex. IP-adresser
spring.config.import=optional:file:./application-local.properties

# Ollama (LLM, embeddings, domare och omformulering)
# Sätts via miljövariabler (eller application-local.properties som är gitignorerad)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# Max 3 unika modeller totalt: qwen3:8b (chatt/validering/följdfrågor), qllama (embedding), phi3.5 (gate/rewrite)
ollama.model=qwen3:8b
ollama.embedding-model=qllama/multilingual-e5-large
ollama.timeout=300s
ollama.validator-model=qwen3:8b
ollama.validate=true
# Samma kontext för qwen3:8b överallt, annars laddar Ollama om modellen med annan num_ctx
ollama.chat-num-ctx=16384
ollama.validator-num-ctx=16384
# Samma modell som chatten så att följdfrågorna inte laddar in en fjärde modell
ollama.refine-model=qwen3:8b
ollama.gate-model=phi3.5:latest
# Samma modell som gate så att omformuleringen inte laddar in en fjärde modell
ollama.rewrite-model=phi3.5:latest

# Qdrant (lokal vektordatabas - ersatter AnythingLLM:s vektorlager)
qdrant.base-url=${QDRANT_BASE_URL:http://localhost:6333}
qdrant.collection=${QDRANT_COLLECTION:docs}
qdrant.vector-size=1024
qdrant.distance=Cosine
qdrant.top-k=5
qdrant.timeout=10s
qdrant.query-prefix=query: 
qdrant.passage-prefix=passage: 

# RAG-installningar
rag.max-history=20
rag.chunk-size=1200
rag.chunk-overlap=200
rag.max-source-chars=8000
# Språk för sökfrågan som skickas till vektordatabasen
rag.search-language=en
# Minsta cosinuslikhet för att en träff ska räknas som källa
rag.similarity-threshold=0.3
# Hybridsökning (vektor + nyckelord med Reciprocal Rank Fusion). Slås på först när E1 visar vinst.
rag.hybrid.enabled=false
rag.hybrid.keyword-limit=50
rag.hybrid.rrf-k=60

# Arkiverade PDF-filer som far visas/laddas ner (skiljs med komma)
archive.pdf-roots=
# Mapp där uppladdade originaldokument sparas (skapas automatiskt)
archive.upload-dir=archive

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# Rimlig övre gräns för att tomma/skrotade requests (tidigare -1 = obegränsat)
server.tomcat.max-swallow-size=512MB
spring.codec.max-in-memory-size=512MB
