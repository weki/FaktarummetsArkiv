# Opt-in: använd qwen3:8b även för gate och rewrite så att bara qwen3 + e5 laddas.
# Aktivera med SPRING_PROFILES_ACTIVE=two-models eller --spring.profiles.active=two-models.
# Detta är inte default; phi3.5 används fortfarande i standardkonfigurationen.
ollama.gate-model=qwen3:8b
ollama.rewrite-model=qwen3:8b
ollama.gate-thinking=false
ollama.rewrite-thinking=false
