# Opt-in: sätt gate och rewrite uttryckligen till chattmodellen.
# Standard är att alla roller ärver ollama.model, så profilen behövs bara om du vill
# göra undantaget explicit eller kombinera den med egna per-roll-värden.
# Aktivera med SPRING_PROFILES_ACTIVE=two-models eller --spring.profiles.active=two-models.
ollama.gate-model=qwen3:8b
ollama.rewrite-model=qwen3:8b
ollama.gate-thinking=false
ollama.rewrite-thinking=false
