<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Inställningar – Fakturummets Arkiv</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/settings.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="settings-page">
<div class="app-layout">
<nav id="sidebar" data-page="settings"></nav>
<div class="page-main">
<header class="settings-topbar">
    <div class="settings-heading">
        <a class="settings-btn settings-back" href="/">← Tillbaka</a>
        <div>
            <h1>Inställningar</h1>
            <p>Alla värden som styr arkivet, med källa och när ändringen slår igenom.</p>
        </div>
    </div>
    <div class="settings-head-actions">
        <span id="settingsStatus" class="status" role="status"></span>
        <button id="resetAllBtn" type="button" class="settings-btn">Återställ alla</button>
        <button id="saveBtn" type="button" disabled>Spara ändringar</button>
    </div>
</header>

<div class="settings-shell">
    <aside class="settings-sidebar">
        <label class="settings-search">
            <span>Sök inställning</span>
            <input id="settingsSearch" type="search" placeholder="t.ex. modell, chunk, Qdrant" autocomplete="off">
        </label>
        <nav id="settingsNav" aria-label="Inställningsgrupper"></nav>
        <div class="settings-file">
            <span>Överridningar sparas i</span>
            <code id="settingsFile">settings.json</code>
            <span id="settingsVersion"></span>
        </div>
    </aside>
    <main id="settingsContent" class="settings-content" aria-live="polite">
        <p class="settings-loading">Läser in inställningar…</p>
    </main>
</div>

</div>
</div>

<template id="groupTemplate">
    <section class="settings-group">
        <div class="settings-group-head">
            <h2></h2>
            <p></p>
        </div>
        <div class="settings-rows"></div>
    </section>
</template>

<script src="/js/shared/common.js"></script>
<script src="/js/shared/threads-store.js"></script>
<script src="/js/shared/sidebar.js"></script>
<script src="/js/shared/model-status.js"></script>
<script src="/js/settings/settings.js"></script>
</body>
</html>
