plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'se.rightech'
version = '0.0.1-SNAPSHOT'
description = 'FakturummetsArkivRAG'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.apache.pdfbox:pdfbox:3.0.4'
    implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'eval'
    }
}

// Utvärdering mot körande Ollama + Qdrant. Frågorna ligger i src/test/resources/eval/questions.jsonl.
tasks.register('eval', Test) {
    group = 'verification'
    description = 'Kör retrieval-utvärdering (recall@5 och MRR) mot en körande Ollama och Qdrant.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'eval'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
    outputs.upToDateWhen { false }
}
